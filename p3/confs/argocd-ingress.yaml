apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: argocd
  namespace: argocd

spec:
  ingressClassName: traefik

  rules:
  - http:
      paths:
      - path: /argo-cd
        pathType: Prefix

        backend:
          service:
            name: argocd-server
            port:
              number: 80
